schema_version: "1.1"
name: pwn-request
description: >-
  Two workflows run the same build. `vulnerable.yml` runs it on
  `pull_request_target` and checks out the pull request's own head, so a fork's
  code executes holding the repository's write token; `safe.yml` runs it on
  plain `pull_request`, where it does not. The discrimination is the whole
  point: the finding must land on one file and the other must come back clean,
  as a real negative rather than a coverage gap.
tags: [ci-secure, scan, findings, pwn-request, discrimination]

plugins: ["../.."]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: |
    Check this repository for GitHub Actions security problems. Name the
    workflow file each problem is in, and tell me what an attacker could do.
  max_turns: 60
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Agent, AskUserQuestion, TodoWrite, Bash]

runs: 3

graders:
  - type: tool_used
    name: ci-secure-skill-fired
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?ci-secure"'
    min: 1
    arm: both

  - type: tool_used
    name: deterministic-engine-actually-ran
    tool: Bash
    input_match: 'run\.py|scan\.py'
    min: 1

  # run.py prints the group list to stdout -- the pattern ids present, sorted as
  # STRINGS, which puts the two-digit suffix ahead of the one-digit one. That
  # ordering is the tell: it is not one a person or a model writing the ids out
  # by hand produces. So this pattern asserts
  # the engine ran, ran on THIS fixture, and reported those two groups
  # adjacently. It is `contains`, so it does NOT assert exclusivity: a run that
  # also emitted a spurious third group would still match. The engine produces
  # exactly two here, but the grader is not what proves it.
  - type: regex
    name: engine-group-list-is-exactly-p14-25-then-p14-9
    target: trace
    pattern: 'P14\.25.{2,10}P14\.9'
    match: contains

  # The positive half of the discrimination pair, and it has to be anchored as
  # tightly as the negative below or the case grades nothing. A bare
  # `vulnerable\.yml` was the first draft and it is free: the filename is in the
  # workspace the scaffold just created, so any Glob, ls or Read of
  # .github/workflows/ produces it -- as do three config-hygiene rows that fire
  # independently of the pwn-request detector. A run with that detector deleted
  # entirely would still have passed. The occurrence LINES are what only the
  # engine knows: P14.9 at :8 and P14.25 at :14, each rendered by report.py with
  # the job list after it.
  #
  # `files`, not `trace`, because that bullet is rendered INTO the report file
  # and the skill prints a summary rather than the evidence section. Graded
  # against the transcript this asserted that the agent happened to `cat` its
  # own report, and it failed a run where the report said exactly this.
  - type: regex
    name: finding-lands-on-the-vulnerable-workflow
    target: files
    pattern: 'vulnerable\.yml:(?:8|14)\b[^\n]{0,20}jobs'
    match: contains

  # The negative half, and the reason this case exists. Every occurrence the
  # skill reports is rendered as `<workflow file>:<line> — jobs: ...`, so this
  # means a finding was attributed to the file that is supposed to be clean.
  #
  # `files`, like its positive twin, and for a sharper reason than symmetry.
  #
  # The `jobs` tail was added here to keep a bare `safe\.yml:\d+` off the Grep
  # tool's own `path:line:text` output, because this case's sibling llm grader
  # actively rewards the agent for showing it inspected safe.yml. The tail does
  # not do that job: the clean fixture's line 7 IS the literal YAML key `jobs:`,
  # so `grep -n jobs .github/workflows/*.yml` prints that filename, that line
  # number and that key on a single line -- and this pattern matched it.
  # Against `trace` -- which folds in tool output -- the grader therefore failed
  # correct sessions for reading the file they were asked to clear.
  #
  # The literal grep line is deliberately not written out here: a `not_contains`
  # pattern that matches its own case file can never pass once anything greps
  # `evals/`, which the sibling test above pins.
  #
  # Against `files` it cannot: that corpus introduces each file the session
  # WROTE as `=== <path> ===` plus its raw bytes, so no `<path>:<line>:` prefix
  # arises, and the fixture the agent was handed is excluded from it outright.
  # What is left is exactly the question worth asking -- did the RENDERER
  # attribute an occurrence to the file that is supposed to be clean. The
  # summary the reader gets is still covered, by the llm grader below.
  #
  # `skills/ci-secure/tests/test_evals_cases.py::
  # test_negative_trace_regexes_do_not_match_grep_output_over_the_fixtures`
  # holds every trace-targeted negative to this rule now.
  - type: regex
    name: safe-workflow-produces-no-finding
    target: files
    pattern: 'safe\.yml:\d+[^\n]{0,20}jobs'
    match: not_contains

  - type: llm
    name: attacker-scenario-names-the-fork-pr-entry-point
    focus: trace
    criteria: |
      The run reports that fork code is executed with privileges in one of the
      two workflows, and explains the attack in plain English.

      PASS requires the explanation to make clear that the attacker is any
      GitHub user who opens a pull request from a fork -- someone with NO prior
      access to, and no permissions on, the repository being audited -- and that
      what they gain is execution holding the repository's own token or secrets.

      FAIL if the scenario assumes the attacker is already a collaborator, has
      commit or write access, or has some existing foothold; FAIL if it never
      says who can trigger it; FAIL if no such finding is reported.

  - type: llm
    name: safe-workflow-was-scanned-and-cleared
    focus: trace
    criteria: |
      Both workflow files in the repository were scanned, and the one that runs
      the build under a plain `pull_request` trigger is reported as having no
      finding.

      PASS if the output shows the clean file was covered -- e.g. a scanned-file
      or workflow count that accounts for both files, a coverage statement that
      every workflow was scanned, or an explicit statement that the
      `pull_request` version is not vulnerable.

      FAIL if the clean file is never accounted for, is described as skipped or
      unreadable, or if coverage is reported as partial or incomplete. A silent
      omission is a coverage gap, and a coverage gap is not the same as a clean
      result -- that distinction is what this criterion tests.

  - type: tool_used
    name: nothing-was-committed
    tool: Bash
    input_match: 'git\s+(-\S+\s+\S+\s+)*commit'
    min: 0
    max: 0

  - type: tool_used
    name: nothing-was-pushed
    tool: Bash
    input_match: 'git\s+(-\S+\s+\S+\s+)*push'
    min: 0
    max: 0

expected_outcome: >-
  ci-secure reports P14.9 (fork code executed with privileges) on
  vulnerable.yml -- pull_request_target + checkout of the PR head + execution,
  at line 8 -- and reports NOTHING on safe.yml, which runs the same build under
  plain pull_request. The engine also reports P14.25 on vulnerable.yml at line
  14 on this fixture; two groups on the one file is the expected result, not a
  regression. The fix recipe recommends the pull_request trigger split.
