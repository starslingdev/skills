schema_version: "1.1"
name: template-injection
description: >-
  A single workflow carries one template-injection surface: a
  `pull_request_target` job that interpolates the PR title straight into a
  `run:` block. The skill must run its own scanner rather than eyeballing the
  YAML, report P14.10 at the exact file and line, explain in plain English what
  an attacker could do with it, and change nothing in git.
tags: [ci-secure, scan, findings, template-injection]

# `skills/ci-secure/` is a bare skill folder with no plugin.json, so the harness
# cannot auto-detect the plugin under test. Without this the ablation arm would
# compare nothing to nothing and the case would be dropped up front.
plugins: ["../.."]

context:
  scaffold_script: scaffold.sh

execution:
  # Deliberately the ordinary shape of the ask: no path, no skill name, no hint
  # about where the scanner lives. The second sentence is what makes the
  # file:line and the attacker scenario part of the answer instead of details
  # buried in a report file the graders cannot reach.
  prompt: |
    Run a CI security audit on the GitHub Actions workflows in this repository.

    For each finding, quote the exact file and line it sits on, and explain in
    plain English what an attacker could actually do with it.
  max_turns: 60
  timeout_seconds: 900
  # Effective tools are this list intersected with the harness's read-only set,
  # plus whatever the operator grants. Bash is NOT read-only: the run needs
  # `--allow-tools Bash` or the scanner can never execute. See evals/README.md.
  allowed_tools: [Read, Glob, Grep, Skill, Agent, AskUserQuestion, TodoWrite, Bash]

runs: 3

graders:
  # -- mechanism -------------------------------------------------------------
  - type: tool_used
    name: ci-secure-skill-fired
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?ci-secure"'
    min: 1
    # `arm: both` is load-bearing. A `tool_used` grader on `Skill` with no
    # explicit arm is auto-demoted to an unscored "the plugin fired" indicator,
    # which would quietly remove this assertion from the score in BOTH arms.
    arm: both

  - type: tool_used
    name: deterministic-engine-actually-ran
    tool: Bash
    # The central expectation of the original eval: the verdict comes from the
    # skill's own scanner, not from an LLM reading YAML. This is also the
    # sharpest ablation signal in the suite -- the without-arm has no such
    # script anywhere it can reach.
    input_match: 'run\.py|scan\.py'
    min: 1

  # -- outcome ---------------------------------------------------------------
  - type: regex
    name: injection-reported-at-its-real-file-and-line
    target: files
    # Ground truth, re-derived from the engine while authoring this case.
    # Anchored on the report's own `<file>:<line>` rendering.
    #
    # This one is falsifiable but carries NO ablation signal, and the grader
    # below is why it is not left to stand alone: the occurrence sits on the
    # last line of a very short fixture, so a `grep -n` over the workflow prints
    # the same file and line, and an agent with no skill loaded, eyeballing the
    # YAML, matches it too.
    #
    # `files` rather than `trace` for exactly that reason. The skill renders
    # this into the report and prints a summary that carries the file without
    # the line, so on the transcript the grader passed or failed on whether the
    # agent happened to `grep -n` -- it scored the tool the agent reached for,
    # not the finding. Its sibling in impostor-check-skipped, the same pattern
    # on the same fixture, came up tails and failed a correct run.
    pattern: 'ci\.yml[^\n]{0,30}?\b11\b'
    match: contains

  # The engine-completion anchor, and the only grader in this case a failed
  # scanner cannot satisfy. `tool_used` above sees a Bash command that MENTIONED
  # run.py -- one that mentioned it and exited 1 looks identical -- and the
  # occurrence line above is one `grep -n` away from an agent eyeballing an
  # 11-line fixture. What neither produces is the engine's own serialization:
  # run.py prints its group list to stdout as a JSON array of string-sorted ids.
  #
  # The closing bracket is load-bearing. SKILL.md's Phase 2 (Scan) section
  # carries a two-group array as a worked example, so a pattern ending at the
  # id would be a quotation from
  # the skill; requiring the bracket immediately after makes it a single-group
  # result, which only this fixture's run produces.
  #
  # THE LIMIT OF THIS, stated because it is a real one and a reviewer raised it:
  # no trace grader can prove PROVENANCE. This asserts the engine's exact
  # serialization appeared; it cannot rule out an agent that ran the scanner,
  # watched it fail, and then wrote that string itself. The harness offers no
  # grader that observes a tool's exit status or its output -- `tool_used`
  # matches the invocation's INPUT only, and `file_exists` cannot reach the one
  # artifact whose absence would prove failure, because SKILL.md keys the
  # findings path to a hash of the repository root and the sandbox's root is
  # different every run. Closing this properly needs either a harness grader
  # that reads tool results, or a prompt that names a fixed output path -- and
  # the second would trade away this case's realism, since the report is
  # supposed to be written only on a user's save pick. Until then the suite
  # asserts invocation plus output shape, and this residual is accepted, not
  # solved. evals/README.md lists it under what is not verified.
  - type: regex
    name: engine-group-list-is-exactly-p14-10
    target: trace
    pattern: '\["P14\.10"\]'
    match: contains

  # The renderer's pre-drawn banner. Weaker than the group list and kept as
  # corroboration rather than proof: the banner's FORMAT is documented in
  # SKILL.md, so on a one-finding fixture an agent could write the count itself.
  # It earns its place by pinning the count the renderer computed against the
  # finding the case asserts, not by proving the engine ran.
  - type: regex
    name: banner-reports-one-of-ten-vectors-hit
    target: trace
    pattern: '(?<![\d.])1 of 10 vectors hit'
    match: contains

  - type: llm
    name: finding-carries-an-attacker-scenario
    focus: trace
    criteria: |
      The transcript reports a template-injection finding in a GitHub Actions
      workflow AND explains, in plain English, what an attacker could do with
      it.

      PASS requires the explanation to name all three of:
        - who the attacker is and what access they need (anyone who can set the
          text of a pull request / issue / comment -- no write access to the
          repository);
        - the mechanism (the untrusted text is substituted into the shell
          command before the shell parses it, so it becomes commands);
        - what they gain (running commands with the workflow's privileges --
          stealing secrets, using the repository token, tampering with builds).

      FAIL if the finding is reported with only a rule name, a severity, a
      catalog id, or a generic "this is a security risk" sentence; FAIL if the
      explanation is copied catalog boilerplate that never connects to this
      workflow; FAIL if no finding is reported at all.

  # -- negatives -------------------------------------------------------------
  # These need no tool grant to be meaningful: if Bash is granted the agent
  # could commit and must not, and if it is not granted they hold trivially.
  - type: tool_used
    name: nothing-was-committed
    tool: Bash
    input_match: 'git\s+(-\S+\s+\S+\s+)*commit'
    min: 0
    max: 0

  - type: tool_used
    name: nothing-was-pushed
    tool: Bash
    input_match: 'git\s+(-\S+\s+\S+\s+)*push'
    min: 0
    max: 0

  - type: tool_used
    name: no-pull-request-was-opened
    tool: Bash
    input_match: 'gh\s+pr\s+create'
    min: 0
    max: 0

expected_outcome: >-
  ci-secure scans the workflow and reports a template-injection finding (P14.10)
  for the untrusted ${{ github.event.pull_request.title }} expression used in a
  run: block, with a plain-English attacker scenario, and the report carries the
  scope-honesty line (critical exploit-chain checks only, not a comprehensive
  audit). A markdown report is produced only on the user's save pick. Nothing is
  committed or pushed. NOTE: the scope-honesty expectation carried over from the
  retired evals.json and no grader here checks it -- only clean-repo's llm
  criteria do. See "Not covered by any grader" in evals/README.md.
