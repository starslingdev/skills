name: Multiarch image
on: pull_request
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: make build
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
