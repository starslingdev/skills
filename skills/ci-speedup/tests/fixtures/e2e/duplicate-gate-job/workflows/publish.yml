name: Publish
on:
  push:
    branches: [main]
concurrency: publish-${{ github.ref }}
jobs:
  test:
    name: Unit tests
    strategy:
      matrix:
        runner: [ubuntu-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - run: npm test
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: docker build -t example/app .
