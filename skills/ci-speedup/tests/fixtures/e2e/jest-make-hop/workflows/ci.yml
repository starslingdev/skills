name: Jest checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: frontend/.cache/jest
          key: jest-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: jest-
      - run: make test_frontend_ci
  gate:
    runs-on: ubuntu-latest
    steps:
      - run: echo gate
