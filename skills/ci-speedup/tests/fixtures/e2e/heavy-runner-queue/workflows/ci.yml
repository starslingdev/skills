name: Queued CI
on: pull_request
jobs:
  build:
    runs-on: [self-hosted, slow-linux]
    steps:
      - run: make build
  lint:
    runs-on: [self-hosted, fast-linux]
    steps:
      - run: make lint
  probe:
    runs-on: [self-hosted, cancelled-linux]
    steps:
      - run: make probe
  gate:
    needs: [build, lint]
    runs-on: [self-hosted, slow-linux]
    steps:
      - run: make test
