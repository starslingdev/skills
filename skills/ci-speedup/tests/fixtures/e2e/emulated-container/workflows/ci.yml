name: Emulated container CI
on: pull_request
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: uraimo/run-on-arch-action@v2
        with:
          arch: aarch64
          distro: ubuntu22.04
          env: |
            MAKE_TARGET: check
          run: make $MAKE_TARGET
      - uses: uraimo/run-on-arch-action@v2
        with:
          arch: aarch64
          distro: ubuntu22.04
          run: make all $EXTRA
  gate:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: make test
