name: Reusable package tests
on:
  workflow_call:
    inputs:
      package-set:
        type: string
        required: true
jobs:
  test:
    strategy:
      matrix:
        shard: [api-20, api-22, web-20, web-22]
    runs-on: ubuntu-latest
    steps:
      - name: Setup
        run: echo ready
      - name: Build
        run: make build
      - name: Install browser
        run: pnpm exec playwright install chromium
      - name: Tests
        run: cargo test
