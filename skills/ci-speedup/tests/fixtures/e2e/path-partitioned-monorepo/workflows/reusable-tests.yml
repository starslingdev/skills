name: Reusable package tests
on:
  workflow_call:
    inputs:
      package-set:
        type: string
        required: true
jobs:
  test:
    strategy:
      matrix:
        package: [api, web]
        runtime: [20, 22]
    runs-on: ubuntu-latest
    steps:
      - name: Setup
        run: echo ready
      - name: Build
        run: make build
      - name: Install browser
        run: pnpm exec playwright install chromium
      - name: Tests
        run: make test PACKAGE=${{ matrix.package }} RUNTIME=${{ matrix.runtime }}
