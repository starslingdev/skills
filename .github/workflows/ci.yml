name: CI

# Runs the full test suite (`pytest -v`) on every push to main and every pull request — the same
# suite a developer runs locally must pass before code can merge.
#
# The suite runs as two mutually exclusive jobs: self-hosted for pushes and same-repo PRs
# (this repo dogfoods StarSling runners), GitHub-hosted for fork PRs (untrusted code never
# executes on the self-hosted pool). The required branch-protection check is `test` — the
# always-running verdict job at the bottom — NOT either suite job. GitHub counts a skipped
# required check as passing, so requiring a job that skips itself on fork PRs meant a fork PR
# could merge with zero tests executed. The verdict is always produced, and passes only when
# the one suite job that was supposed to run actually ran and passed.
# tests/test_ci_required_check_verdict.py pins every clause of this arrangement.
#
# Residual, NOT closed by this arrangement: on `pull_request` the workflow definition comes from
# the PR's own merge ref, so a fork PR that edits this file edits its own gate (and the guard
# tests are editable in the same PR). That is loud in the diff and the merge still needs a
# maintainer, but the gate is not self-enforcing against a hostile PR — reviewing `.github/**`
# and `tests/` changes on fork PRs is the actual control.
on:
  # No merge_group trigger: this repo has no merge queue. If one is ever enabled, the trigger
  # list and BOTH suite `if:` guards must change together — on a merge_group event there is no
  # github.event.pull_request, so test-self would skip and test-fork would fire.
  push:
    branches: [main]
  pull_request:

# One in-flight run per ref — a new push cancels the previous, still-running CI for that branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the gate only reads the checked-out code.
permissions:
  contents: read

jobs:
  test-self:
    name: test (self-hosted)
    # Never execute untrusted fork-PR code on the self-hosted runner: run only for pushes and
    # pull requests whose head is this same repository. Fork PRs get the identical suite on
    # GitHub-hosted runners via test-fork below.
    runs-on: starsling-ubuntu-24.04
    # Without this, a dead runner pool leaves the job queued (self-hosted jobs wait up to 24h)
    # and the required `test` check pending with no signal. The suite itself takes ~1.5 min.
    timeout-minutes: 30
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # Third-party actions are pinned to a commit SHA (the tag comment is for humans only) so a
      # moved/compromised tag can't silently change what runs in CI.
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history so any provenance/ancestry guard can verify a recorded skill commit is an
          # ancestor of HEAD (a shallow depth-1 checkout wouldn't contain those commits).
          fetch-depth: 0
          # The gate only reads code (it never pushes), so don't leave the job token in .git/config.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      # Node is required for the dogfood-loop JS test: tests/test_dogfood_retry_node.py runs
      # dogfood-retry.test.mjs under `node` and hard-fails in CI if node is missing.
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "20"

      - name: Install test dependencies
        run: pip install pytest pyyaml

      - name: Run tests
        run: pytest -v

  test-fork:
    name: test (fork)
    # Inverse of test-self's guard: fork PRs only, on GitHub-hosted runners with no access to
    # repo secrets. Same contract, different infrastructure. Lives in this workflow (not a
    # separate file) because the verdict job below must `needs:` it, and `needs` cannot see
    # across workflows — the old two-file layout is what let the check names diverge.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history so any provenance/ancestry guard can verify a recorded skill commit is an
          # ancestor of HEAD (a shallow depth-1 checkout wouldn't contain those commits).
          fetch-depth: 0
          # The gate only reads code (it never pushes), so don't leave the job token in
          # .git/config — on a fork PR least of all.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "20"

      - name: Install test dependencies
        run: pip install pytest pyyaml

      - name: Run tests
        run: pytest -v

  # ONE check name carries the verdict for fork and non-fork alike. The two suite jobs are
  # mutually exclusive, so a branch protection rule naming either of them directly is
  # satisfiable by never running it: GitHub counts a skipped required check as a pass. This job
  # always runs, so the required `test` check is always reported, and it passes only when the
  # suite that was supposed to run actually ran and passed.
  #
  # `always()`, not `!cancelled()`: a cancelled run reports this job as skipped, and GitHub
  # reads a skipped required check as green — a one-click bypass. The cost is a stale red on
  # superseded runs; branch protection reads the newest run, so that costs nothing.
  #
  # GitHub-hosted on purpose: this job runs on fork PRs too, and its `run:` block travels with
  # the head ref, so a self-hosted runner here would execute fork-authored shell on StarSling
  # infrastructure. It checks out nothing.
  verdict:
    name: test
    needs: [test-self, test-fork]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the suite that should have run to have passed
        env:
          SELF_HOSTED: ${{ needs.test-self.result }}
          FORK: ${{ needs.test-fork.result }}
        run: |
          set -euo pipefail
          echo "self-hosted suite: ${SELF_HOSTED}"
          echo "fork suite:        ${FORK}"
          # Exactly one of the two is meant to run; the other reports "skipped".
          # Anything else - both skipped, either failed, either cancelled - is
          # not a pass: a suite that did not run is not a suite that passed.
          if [ "${SELF_HOSTED}" = "success" ] && [ "${FORK}" = "skipped" ]; then
            echo "test passed (self-hosted suite)."
            exit 0
          fi
          if [ "${FORK}" = "success" ] && [ "${SELF_HOSTED}" = "skipped" ]; then
            echo "test passed (fork suite)."
            exit 0
          fi
          echo "::error::test has no passing verdict (self-hosted=${SELF_HOSTED}, fork=${FORK}) - a suite that did not run, was cancelled, or failed is not a pass"
          exit 1
