name: Snyk API probe

# A DIAGNOSTIC, not a gate. `registry scan`'s positive control started failing on
# unchanged code on 2026-08-18: the scanner reports nothing on any fixture shape,
# including credential exfiltration. The CLI discards the status line, the
# response headers and the body, so its output cannot say whether that is a
# quota, a retired API version, or detection being down.
#
# This asks the analysis API directly and prints its whole answer. It never
# fails the build and never runs automatically — a scanner call costs, and this
# is for a human diagnosing a specific incident.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: snyk api probe
    # Same runner as `registry scan`, deliberately: if the answer differs by
    # network path, the probe has to be on the path the failing gate uses.
    runs-on: starsling-ubuntu-24.04
    timeout-minutes: 20
    # Public repo only, matching registry-scan.yml. A private mirror has no
    # SNYK_TOKEN and would report a network failure as a finding.
    if: github.repository == 'starslingdev/skills'
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      # A probe that could not reach the API must say so rather than printing an
      # empty report that reads like a clean answer.
      - name: Require SNYK_TOKEN
        run: |
          if [ -z "${SNYK_TOKEN}" ]; then
            echo "::error title=PROBE DID NOT RUN::SNYK_TOKEN is not set, so nothing was asked."
            exit 1
          fi

      # Pinned to the exact version the failing gate ran (`uvx
      # snyk-agent-scan@latest` resolved to 0.5.17 on both the passing 06:52 run
      # and the failing 22:29 one), so the probe cannot answer for a different
      # build than the one being diagnosed.
      - name: Ask the analysis API what it is doing
        run: |
          uv run --with snyk-agent-scan==0.5.17 \
            python .github/scripts/snyk_api_probe.py 2>&1 | tee snyk-api-probe.txt

      - name: Upload the transcript
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snyk-api-probe
          path: snyk-api-probe.txt
          retention-days: 14
          if-no-files-found: warn
