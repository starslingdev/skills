name: Registry scan

# Runs the same third-party security scanner that skill registries publish audits from
# (Snyk Agent Scan) against the installable skill trees under `skills/`, so a rule violation
# fails our build instead of appearing as a public FAIL badge days after release.
#
# WHAT THIS DOES NOT COVER. Registries run more than one scanner. This gate reproduces exactly
# one of them (Snyk Agent Scan). It says nothing about Gen Agent Trust Hub — which publishes no
# rule catalog and no CLI, and whose verdicts are LLM-generated and not reproducible — or about
# Socket. A green check here means "Snyk Agent Scan finds nothing we have not accepted". It does
# not mean every registry scanner will pass.
#
# WHAT A RUN COSTS. Every scanner invocation is one analysis request against the scanner's
# public tier, which SNYK_TOKEN authenticates against and which has a daily usage allowance
# that is undocumented and shared by every run of this workflow that day. A run spends TWO:
# the red-proof control (its own one-skill fixture — the only proof the scanner can see)
# and the one unfiltered scan of `skills/`, whose JSON the gate reads offline. It used to
# spend three; on 2026-09-14 the third call of the first run of the day was refused, and
# every PR run after it went red saying DID NOT COMPLETE over a tree nobody had looked at.
# The allowance has been observed to shrink without notice, so even the reduced run can
# hit it on a busy day. When it does, the job must fail — a scan that did not run is not
# a clean scan — but it must say "quota", never "finding" and never "blind": that is the
# `quota` class in .github/scripts/registry_scan_gate.py and the control's own quota
# outcome, and both name the reset. The unlock is enabling Agent Scan on the Snyk tenant
# and running the scanner with a tenant push key, not a different token.
#
# WHICH PULL REQUESTS ARE SCANNED. Only those that touch something the scan reads: a skill
# tree, this workflow, the scripts it runs, or the test that pins its shape. A PR changing
# nothing under those paths gets no scan and no `registry scan` check at all — not a green
# one, none. That is a deliberate trade against the daily allowance above: a docs-only PR
# used to spend the same calls as a skill change. The push to main is NOT filtered, so every
# merge is still scanned; the schedule is not filtered either, because it is what notices a
# rule-catalog change that needed no commit of ours. `tests/test_registry_scan_workflow.py`
# derives the list of files the scan depends on from this file's own `run:` lines and fails
# if the filter below misses one, so a new script cannot be forgotten here.
on:
  pull_request:
    paths:
      - "skills/**"
      - ".github/workflows/registry-scan.yml"
      - ".github/scripts/registry_scan_*.py"
      - "tests/test_registry_scan_workflow.py"
  push:
    branches: [main]
  # The scanner's rule catalog changes without any commit of ours: a renamed, retired, or newly
  # added rule can turn a shipped skill red on its own. The weekly run is what notices.
  schedule:
    - cron: "23 7 * * 1" # Mondays, 07:23 UTC
  workflow_dispatch:

# One in-flight run per ref per event — a new push cancels the previous, still-running run for
# that branch. `github.event_name` is in the key because a push to main and the weekly scheduled
# run share `refs/heads/main`: without it, a push would cancel the scheduled run, and a cancelled
# run notifies nobody. The schedule is the only trigger that notices a rule-catalog change that
# needed no commit of ours, so it must not be silently cancellable.
concurrency:
  group: registry-scan-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the gate only reads the checked-out code.
permissions:
  contents: read

env:
  # THE GATING RULE, restated for scanner 0.6.0 (owner ruling 2026-08-10, re-ruled
  # 2026-08-26). 0.6.0 has no E/W classes — it reports named risks with 0-1000 scores —
  # so "criticals block, warnings do not" is now a list of risk NAMES that do not block.
  #
  # The list and the reasoning live in .github/scripts/registry_scan_contract.py, which
  # is the single place this workflow's three readers get the vocabulary from. The
  # gate applies it OFFLINE, to the JSON the one scan below writes — it is no longer
  # passed to the scanner as `--ignore-risks` on a second call. Only the red-proof
  # control still hands it to the scanner, because the control's job is to prove the
  # gate's real policy can go red.
  #
  # History, so nobody reintroduces it: the list was once passed to
  # `--ignore-failure-codes`, which is a DIFFERENT flag, not the renamed one — it
  # accepts only the scanner's X001-X009 runtime codes. The scanner printed `unknown
  # failure code: W001` fifteen times a run and left every risk of every score
  # blocking — the gating policy off, on a green build.
  SCAN_PATH: skills

  # Read from the contract so the pin is named in one place. Every coverage-gap message
  # below ends with it.
  STALE_PIN_HINT: >-
    If this is not obviously a problem with the skills themselves, suspect the scanner
    pin first: this gate runs snyk-agent-scan==0.6.0, and a newer release can rename a
    flag, a risk, or the JSON shape out from under it. Compare against the current
    release before assuming the tree is at fault.

jobs:
  scan:
    name: registry scan
    # This repo dogfoods StarSling runners for its own CI (matching ci.yml). The runner is
    # self-hosted, so never execute untrusted fork-PR code on it, and repository secrets —
    # SNYK_TOKEN included — are not available to fork PRs anyway. Fork PRs get the
    # `fork-not-scanned` job below, which reports the coverage gap instead of a green check.
    runs-on: starsling-ubuntu-24.04
    # The scan talks to a network service. A stalled request would otherwise hold a self-hosted
    # runner for the six-hour GitHub default with no signal.
    timeout-minutes: 20
    # Public repo only. On any private staging copy of this tree (e.g. a pre-launch mirror),
    # running the scan would send UNRELEASED skill text to a third-party scanner API — for a new
    # skill, the verdict minted on that first contact is the one it wears, so the scan is held
    # until launch. The guard also keeps a mirror's missing/foreign SNYK_TOKEN from painting
    # every staged PR red with a scan that was never supposed to run there.
    if: >-
      github.repository == 'starslingdev/skills' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      # Third-party actions are pinned to a commit SHA (the tag comment is for humans only) so a
      # moved/compromised tag can't silently change what runs in CI.
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # The scanner reads the working tree only — no history needed, unlike ci.yml's
          # provenance guard.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      # A missing token must never look like a clean scan. This is the whole point of the gate:
      # the failure we are guarding against is a security finding nobody saw, and a silently
      # skipped security scan is that same failure wearing a green check. On internal pushes and
      # PRs the secret is expected to exist, so its absence is a red build, not a quiet skip.
      - name: Require SNYK_TOKEN
        run: |
          if [ -z "${SNYK_TOKEN}" ]; then
            echo "::error title=REGISTRY SCAN DID NOT RUN::SNYK_TOKEN is not set. No skill was scanned. This is a coverage gap, not a clean result."
            echo "================================================================"
            echo "  REGISTRY SCAN DID NOT RUN — NOTHING WAS SCANNED"
            echo ""
            echo "  SNYK_TOKEN is not set, so the scanner could not contact Snyk"
            echo "  and no skill under '${SCAN_PATH}' was analysed. Do NOT read this"
            echo "  run as 'scanned, clean' — it is a coverage gap."
            echo ""
            echo "  Fix: add a SNYK_TOKEN repository secret. Get the token from a"
            echo "  free Snyk account at https://app.snyk.io/account (API Token ->"
            echo "  KEY -> click to reveal), then add it under Settings -> Secrets"
            echo "  and variables -> Actions -> New repository secret."
            echo "================================================================"
            exit 1
          fi
          echo "SNYK_TOKEN is set — the scan below is a real scan."

      # A gate that scans nothing is a gate that passes. The token check above catches one way
      # that happens; this catches the other. The scanner reads a directory of `<name>/SKILL.md`
      # subdirectories, so if SCAN_PATH is renamed, moved, or restructured (a `skills/<category>/`
      # nesting, say), the scanner finds zero skills, reports nothing, exits 0, and this check
      # goes green having analysed no skill at all. The red-proof below cannot catch that: it
      # scans its own temp fixture and never touches SCAN_PATH.
      - name: Require the scan path to contain skills
        run: |
          count=$(find "${SCAN_PATH}" -mindepth 2 -maxdepth 2 -name SKILL.md | wc -l | tr -d ' ')
          if [ "${count}" -eq 0 ]; then
            echo "::error title=REGISTRY SCAN HAS NOTHING TO SCAN::No '<name>/SKILL.md' found under '${SCAN_PATH}'. The scanner would find zero skills and exit 0. This is a coverage gap, not a clean result."
            exit 1
          fi
          echo "Found ${count} skill(s) under '${SCAN_PATH}' to scan."

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      # A check that cannot fail is not a check. This scans a throwaway skill built in a temp
      # directory whose text carries the exact violation class that got a shipped skill flagged,
      # and it fails this job unless the scanner reports the finding AND exits non-zero. It also
      # catches the other direction: if the rule is renamed or retired in a catalog revamp, this
      # step goes red and we find out from our own CI instead of from a public audit page.
      # The offending string is assembled at runtime — committing one is the thing we're guarding
      # against — so nothing in this repository contains it. It runs the gate's real flags,
      # the non-blocking risk list included, so an exemption that grew to swallow the anchor
      # would fail here rather than quietly neutering the gate.
      #
      # `continue-on-error` here does NOT make the control advisory — the
      # "Report the coverage gap" step below fails the build on its outcome, and
      # tests/test_registry_scan_workflow.py fails if that step goes missing. It
      # exists so the steps AFTER this one still run. On 2026-08-18 a hard
      # failure here stopped the job at this step, so a scanner that had gone
      # blind cost us not just the gate but every finding it might still have
      # reported: the unfiltered pass never ran and the artifact upload logged
      # "No files were found". The report is the half that would show detection
      # coming back, so it must survive the control failing.
      - name: Prove the gate can go red
        id: red_proof
        continue-on-error: true
        run: python .github/scripts/registry_scan_redprove.py

      # ONE pass over SCAN_PATH, on purpose, and exactly one — the scanner is a network
      # service against a public tier with a daily allowance, so every invocation costs.
      # This used to be two: this unfiltered pass, and a second `--ci --ignore-risks` call
      # over the same tree for the exit code. The second call added nothing this document
      # does not already contain — the scanner's `--ci` verdict is "any risk left after
      # the exemptions, or any error flagged is_failure", a few lines over the same JSON —
      # and on 2026-09-14 it was the call that pushed the day over the cap. The gate step
      # below applies that rule offline to this file instead.
      #
      # No exemption list here, ever. `--ignore-risks` nulls the exempt risks out of the
      # response BEFORE it is printed, not just before the exit status is computed, so a
      # pass carrying it is structurally incapable of showing an exempt finding. This
      # pass sees everything; the gate decides what blocks.
      #
      # `--json` rather than the rich report because the JSON is what the report step
      # turns into annotations, a summary table, and an artifact; what the gate reads;
      # and because it carries the per-entry `error` objects (with their category —
      # the gate keys the daily cap on that) and the 0-1000 scores.
      #
      # The exit code is captured under `set +e` and published, because the gate needs
      # it: without `--ci` the scanner exits non-zero only when it could not run at all
      # (a usage error from a renamed flag, an unparseable argument), and a clean-looking
      # document from a scanner that did not exit 0 must not be read as clean. The step
      # still exits with that code so the log shows the failure where it happened.
      - name: Scan (all findings, unfiltered)
        id: scan
        continue-on-error: true
        run: |
          echo "Scanning '${SCAN_PATH}' with no ignore list — every finding the scanner has."
          set +e
          uvx snyk-agent-scan==0.6.0 scan "${SCAN_PATH}" --json > registry-scan-findings.json
          code=$?
          set -e
          echo "scan_exit=${code}" >> "${GITHUB_OUTPUT}"
          exit "${code}"

      # Warnings never fail this build, so they must be impossible to miss instead. This writes
      # each one to the checks tab as an annotation (where a review agent can query it), to the
      # job summary as a table, and leaves the raw set for the artifact upload below. It never
      # gates — it fails only if the scan output is unparseable, because silent surfacing looks
      # exactly like a clean scan.
      - name: Surface findings (annotations, summary, artifact)
        run: python .github/scripts/registry_scan_report.py registry-scan-findings.json

      - name: Upload the finding set
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: registry-scan-findings
          path: registry-scan-findings.json
          retention-days: 14
          if-no-files-found: warn

      # The authoritative gate, and the only step that fails on a finding. It is OFFLINE:
      # it reads the JSON the scan above wrote and applies the scanner's own `--ci` rule
      # to it — any risk not in the contract's exemption list blocks, and so does any
      # error the scanner flagged `is_failure`, which is deliberately not ignored: a scan
      # that broke is not a scan that passed. No second network call.
      #
      # The `id` is what lets the step below tell "we could not look" apart from
      # "we looked and found something". Without it that step reads only the
      # control's outcome, and a run where the control failed AND a critical was
      # reported goes red annotated NOT A FINDING.
      #
      # The script classifies on the document's STRUCTURE — risk keys and error
      # objects — never on printed prose. Every earlier version of this gate grepped
      # the scanner's log, and each grep found a way to be wrong: E-codes 0.6.0 never
      # emits (every real finding announced as NOT A FINDING, 2026-08-20 → 08-25), then
      # `risks found`, which the scanned skills' own text says as a matter of course.
      # The classes it writes (`scan_class`), and what each means, are in the script's
      # docstring; the titled `::error` annotations are the ones this step always
      # printed, plus one: REGISTRY SCAN QUOTA EXHAUSTED — NOT A FINDING, for the day
      # the public tier's cap is hit. That run verified nothing and fails like any
      # other coverage gap; it just says why, and that it resets daily.
      - name: Gate on critical findings
        id: gate
        env:
          SCANNER_EXIT: ${{ steps.scan.outputs.scan_exit }}
        run: python .github/scripts/registry_scan_gate.py registry-scan-findings.json

      # Two red checks that mean opposite things must not look the same. A gate
      # failure above means "a critical finding is in this tree". This step means
      # "nothing was verified" — the scanner reported nothing on a control that
      # is known-malicious, so its silence on the real tree carries no
      # information either. Both are failures; only one is a finding, and the
      # annotation title is what a human, or the checks API a review agent
      # reads, uses to tell them apart.
      #
      # `!cancelled()` rather than `always()`: this step must still run after the
      # gate above fails (that is the whole point), but a cancelled run has not
      # established that the scanner is blind, and the text below asserts a
      # specific verified cause. Claiming it on a cancellation invents a diagnosis.
      - name: Report the coverage gap
        if: ${{ !cancelled() }}
        run: |
          # A SKIPPED gate is not a clean gate, and a passing control does not make a run
          # whose gate never executed meaningful. The steps between the control and the
          # gate are not all continue-on-error — `Surface findings` fails on unreadable
          # scan output — so this is a reachable state, and it must be read BEFORE the
          # control's verdict rather than after it, which is what made the branch at the
          # end of this step unreachable in exactly the case it was written for.
          if [ "${{ steps.gate.outcome }}" != "success" ] && [ "${{ steps.gate.outcome }}" != "failure" ]; then
            echo "::error title=REGISTRY SCAN GATE DID NOT RUN::The gating scan did not run (outcome: ${{ steps.gate.outcome }}), so nothing was checked for critical findings. Read the failing step above. This is a coverage gap, not a clean result. ${STALE_PIN_HINT}"
            exit 1
          fi
          if [ "${{ steps.red_proof.outcome }}" = "success" ]; then
            echo "Control passed: the scanner reported the anchor finding, so this run's result is meaningful."
            exit 0
          fi
          if [ "${{ steps.red_proof.outcome }}" != "failure" ]; then
            echo "::error title=REGISTRY SCAN CONTROL DID NOT RUN::The control step did not run (outcome: ${{ steps.red_proof.outcome }}), so nothing here established whether the scanner can see. Read the failing step above. ${STALE_PIN_HINT}"
            exit 1
          fi
          # The two failures are not exclusive, and this ordering matters: a blind
          # scanner is exactly when a malicious change is most likely to be sitting
          # in the tree, and the unfiltered pass behind the control can still
          # surface one. Announcing the coverage gap over that run would put
          # "NOT A FINDING" on the one result a human most needs to read.
          #
          # The daily cap comes before the generic gap and before the blind-scanner
          # narrative. The control is the first call of the run and the scan the
          # second, so the cap can fall on either; whichever it hit, the run verified
          # nothing for a reason that is neither a finding nor a blind scanner, and
          # the text below must not claim otherwise.
          if [ "${{ steps.gate.outputs.scan_class }}" != "finding" ] && { [ "${{ steps.gate.outputs.scan_class }}" = "quota" ] || [ "${{ steps.red_proof.outputs.control_class }}" = "quota" ]; }; then
            echo "::error title=REGISTRY SCAN QUOTA EXHAUSTED — NOT A FINDING::The scanner's public tier hit its daily usage cap on this run (scan class ${{ steps.gate.outputs.scan_class }}, control class ${{ steps.red_proof.outputs.control_class }}), so nothing under ${SCAN_PATH} was verified. The cap resets daily; re-run this check after the reset. This is a coverage gap, not a security finding, and not a broken or blind scanner."
            {
              echo "## Registry scan: daily cap hit — nothing verified"
              echo ""
              echo "**Nothing was verified on this run, and this is not a finding.** The"
              echo "scanner's public tier allows a limited, undocumented number of analysis"
              echo "calls per day, shared by every run of this workflow, and this run hit it"
              echo "(scan class \`${{ steps.gate.outputs.scan_class }}\`, control class"
              echo "\`${{ steps.red_proof.outputs.control_class }}\`)."
              echo ""
              echo "It resets daily: re-run this check after the reset, or push again then."
              echo "The cap is a property of the public tier that \`SNYK_TOKEN\` authenticates"
              echo "against; the unlock is enabling Agent Scan on the Snyk tenant and running"
              echo "the scanner with a tenant push key, not a different token."
              echo ""
              echo "**Compensating control:** the offline shape guard in"
              echo "\`tests/test_no_ioc_shaped_literals.py\` runs in \`test\`, which is required."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
          if [ "${{ steps.gate.outcome }}" = "failure" ] && [ "${{ steps.gate.outputs.scan_class }}" != "finding" ]; then
            echo "::error title=REGISTRY SCAN DID NOT RUN — NOT A FINDING::The scan did not produce a finding (exit ${{ steps.gate.outputs.scan_exit }}, class ${{ steps.gate.outputs.scan_class }}), so nothing under ${SCAN_PATH} was verified clean. This is a coverage gap. Do NOT read it as a security finding. ${STALE_PIN_HINT}"
            exit 1
          fi
          if [ "${{ steps.gate.outcome }}" = "failure" ]; then
            echo "::error title=REGISTRY SCAN FINDING — AND THE CONTROL WAS BLIND::The gate reported a critical finding in ${SCAN_PATH}. Treat it as a real finding and read the gate step above for its risk name and score. Separately, the control also failed, so the scan's SILENCE elsewhere carries no information — this run is a floor on what is present, not a ceiling."
            {
              echo "## Registry scan: a finding, on a run that also verified nothing else"
              echo ""
              echo "The gating step reported a critical finding under \`${SCAN_PATH}\`."
              echo "**This IS a security finding** — its risk name and score are in the gate step's log."
              echo ""
              echo "The control skill ALSO came back clean on this run, so everything the"
              echo "scan did NOT report is unverified. Treat the finding above as a floor,"
              echo "not as the complete set."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
          echo "::error title=REGISTRY SCAN COVERAGE GAP — NOT A FINDING::The scanner reported nothing on a deliberately malicious control skill, so this run verified NOTHING about ${SCAN_PATH}. This is a coverage gap, not a clean result and not a security finding."
          {
            echo "## Registry scan: coverage gap"
            echo ""
            echo "**Nothing was verified on this run.** The control skill — built in a temp"
            echo "directory, carrying an instruction to fetch a remote installer and pipe it"
            echo "into a shell — came back clean, so the scanner's silence about \`${SCAN_PATH}\`"
            echo "means nothing either."
            echo ""
            echo "**This is not a security finding.** A finding fails the gate step above and"
            echo "names its risk."
            echo ""
            echo "This is the blind-scanner case, not the daily cap: the scanner did NOT report"
            echo "its usage limit on this run (that is classified \`quota\` and says so), it"
            echo "answered — and said nothing. The last time this happened (2026-08-19) the"
            echo "analysis endpoint answered HTTP 200 with an empty finding set on both API"
            echo "versions it supported, on fixtures including credential exfiltration, and it"
            echo "was not the token or the version pin. Check the scanner pin first."
            echo ""
            echo "**Compensating control:** the offline shape guard in"
            echo "\`tests/test_no_ioc_shaped_literals.py\` covers the mechanical half of the"
            echo "malicious-code class with no vendor dependency, and it runs in \`test\`, which"
            echo "is a required check. Prompt injection in skill instructions stays uncovered."
            echo ""
            echo "**When this step stops failing, detection is back.**"
          } >> "${GITHUB_STEP_SUMMARY}"
          exit 1

  fork-not-scanned:
    # The name is the message: this check being green must not read as "scanned, clean".
    name: registry scan NOT RUN (fork PR — no scan coverage)
    # Inverse of the guard above: fork PRs cannot reach repository secrets, so the scanner has no
    # token and cannot run. Failing an external contributor's PR for infrastructure they have no
    # way to fix would be hostile, so this reports rather than blocks — but it reports loudly, and
    # a maintainer must re-run the scan on an internal branch before merging any change to
    # `skills/` that came from a fork.
    # Both halves are load-bearing. On a push, a schedule, or a manual dispatch there is no
    # `github.event.pull_request`, so the second clause alone would be true (null != repo) and
    # this job would post a green "fork PR — no scan coverage" check next to a real scan that
    # did run — the exact misreading the job's name exists to prevent.
    if: >-
      github.repository == 'starslingdev/skills' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report the coverage gap
        run: |
          echo "::warning title=REGISTRY SCAN DID NOT RUN::Fork PRs have no SNYK_TOKEN, so no skill was scanned on this PR. This is a coverage gap, not a clean result — a maintainer must re-run the scan on an internal branch before merging changes under skills/."
          echo "================================================================"
          echo "  REGISTRY SCAN DID NOT RUN — NOTHING WAS SCANNED"
          echo ""
          echo "  This pull request comes from a fork. Fork runs have no access"
          echo "  to the SNYK_TOKEN secret, so the registry scanner could not run"
          echo "  and no skill was analysed."
          echo ""
          echo "  This is a coverage gap, NOT a clean result. Before merging any"
          echo "  change under skills/ from a fork, a maintainer must push the"
          echo "  branch to this repository and let the 'registry scan' job run."
          echo "================================================================"
